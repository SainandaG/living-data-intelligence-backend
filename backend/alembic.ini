# Alembic configuration for Living Data Intelligence backend.
# Uses raw SQL migrations (no SQLAlchemy ORM models).
# Run: alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .

# Connection URL is overridden in env.py from the DB_* env vars.
# This value is a fallback for direct alembic CLI invocations.
sqlalchemy.url = postgresql+asyncpg://%(DB_USER)s:%(DB_PASSWORD)s@%(DB_HOST)s:%(DB_PORT)s/%(DB_NAME)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
